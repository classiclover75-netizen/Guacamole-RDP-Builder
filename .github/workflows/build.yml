name: Build Windows Application

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Type check & lint
        run: npm run lint

      - name: Build Tauri application
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Collect build artifacts
        shell: bash
        run: |
          mkdir -p output

          SETUP_SRC=$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -name "*.exe" | head -n 1)
          PORTABLE_SRC="src-tauri/target/x86_64-pc-windows-msvc/release/guacamole-rdp-builder.exe"

          if [ -z "$SETUP_SRC" ] || [ ! -f "$SETUP_SRC" ]; then
            echo "::error::NSIS setup .exe not found under src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
            exit 1
          fi

          if [ ! -f "$PORTABLE_SRC" ]; then
            echo "::error::Portable .exe not found at $PORTABLE_SRC"
            exit 1
          fi

          cp "$SETUP_SRC" "output/Guacamole-RDP-Builder-Setup.exe"
          cp "$PORTABLE_SRC" "output/Guacamole-RDP-Builder-Portable.exe"

          echo "Build artifacts ready:"
          ls -la output/

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: output/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          name: "Guacamole RDP Builder ${{ github.ref_name }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
