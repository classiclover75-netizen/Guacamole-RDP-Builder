name: Build Windows Application

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Type Check & Lint
        run: npm run lint

      - name: Build Tauri Application
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Rename and Verify Build Artifacts
        run: |
          mkdir output
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe output/Guacamole-RDP-Builder-Setup.exe
          cp src-tauri/target/x86_64-pc-windows-msvc/release/guacamole-rdp-builder.exe output/Guacamole-RDP-Builder-Portable.exe
          
          echo "Verifying generated files:"
          ls -la output/
          
          if [ ! -f "output/Guacamole-RDP-Builder-Setup.exe" ]; then
            echo "Error: Setup.exe not found!"
            exit 1
          fi
          
          if [ ! -f "output/Guacamole-RDP-Builder-Portable.exe" ]; then
            echo "Error: Portable.exe not found!"
            exit 1
          fi
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: output/*.exe

      - name: Create Draft Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "Guacamole RDP Builder ${{ github.ref_name }}"
          files: output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
