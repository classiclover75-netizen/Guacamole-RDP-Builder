name: Build Windows Application

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Type Check & Lint
        run: npm run lint

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri Application
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Rename Build Artifacts
        run: |
          mkdir output
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe output/Guacamole-RDP-Builder-Setup.exe
          cp src-tauri/target/x86_64-pc-windows-msvc/release/guacamole-rdp-builder.exe output/Guacamole-RDP-Builder-Portable.exe
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: output/*.exe
          
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: output

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
